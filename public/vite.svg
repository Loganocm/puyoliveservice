<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #6366F1; stop-opacity: 1" />
      <stop offset="50%" style="stop-color: #8B5CF6; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #3B82F6; stop-opacity: 1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <polygon
    points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5"
    fill="url(#logoGradient)"
    stroke="rgba(255,255,255,0.3)"
    stroke-width="2"
    filter="url(#glow)"
  />
  
  <line x1="50" y1="5" x2="50" y2="95" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <line x1="10" y1="27.5" x2="90" y2="72.5" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <line x1="10" y1="72.5" x2="90" y2="27.5" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  
  <circle cx="50" cy="50" r="15" fill="rgba(255,255,255,0.2)" />
  <polygon
    points="50,38 58,48 54,58 46,58 42,48"
    fill="white"
    opacity="0.9"
  />
</svg>