name: Build & Push Docker Images

# Publishes service images to GHCR. Watchtower on the host polls GHCR every
# 300s and hot-swaps running containers, so anything published here is in
# production within ~5 minutes.
#
# GATE: every job below requires `verify` to pass first. A commit that does
# not type-check or build cannot be published.
#
# See README §"Deployment pipeline".

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: loganocm

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  build-api:
    name: Build & Push API
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/puyio-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/puyio-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-game-server:
    name: Build & Push Game Server
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Game Server image
        uses: docker/build-push-action@v6
        with:
          # Root context: the server depends on packages/engine, which a
          # context rooted at server/ cannot see. Must stay in step with the
          # game-server service in docker-compose.yml.
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/puyio-game:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/puyio-game:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
