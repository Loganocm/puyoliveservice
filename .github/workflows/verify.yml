name: Verify

# Reusable verification pipeline. Called by:
#   - ci.yml     on every branch push and PR
#   - deploy.yml as a required gate before any image is published
#
# Nothing reaches production without passing every job here. Watchtower
# auto-deploys published images within ~5 minutes, so this is the only gate.
#
# See README §"Continuous integration".

on:
  workflow_call:

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install client dependencies
        run: npm ci
      - name: Install API dependencies
        working-directory: ./api
        run: npm ci
      - name: Install game server dependencies
        working-directory: ./server
        run: npm ci

      - name: Type check client
        run: npx tsc --noEmit -p tsconfig.json
      - name: Type check API
        working-directory: ./api
        run: npx tsc --noEmit -p tsconfig.json
      - name: Type check game server
        working-directory: ./server
        run: npx tsc --noEmit -p tsconfig.json

  engine-tests:
    name: Engine tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # Pure simulation tests: no database, no network, no browser.
      # Characterization goldens gate every refactor of the engine.
      - name: Run engine suite
        run: npm test

      - name: Fail if goldens drifted
        run: |
          if ! git diff --quiet -- tests/**/__snapshots__; then
            echo "::error::Snapshot goldens changed during the test run."
            echo "A behaviour change must be committed deliberately with an ADR."
            git diff -- tests/**/__snapshots__
            exit 1
          fi
          echo "goldens stable"

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install client dependencies
        run: npm ci

      - name: Build client bundle
        run: npm run build

      - name: Fail if the client bundle is empty
        run: |
          test -f dist/index.html || { echo "::error::client build produced no index.html"; exit 1; }
          echo "client bundle OK ($(du -sh dist | cut -f1))"

  deploy-smoke:
    name: Deploy smoke test
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      # Building the images is not enough: an image can build cleanly and still
      # fail to boot (bad migration, missing env var, wrong entrypoint). This
      # brings the real stack up and proves it answers, because Watchtower
      # deploys whatever is published within ~5 minutes with no other gate.
      - name: Build and start the stack
        env:
          DB_PASSWORD: smoke_test_password
          JWT_SECRET: smoke_test_jwt_secret_that_is_at_least_sixty_four_characters_long_ok
          INTERNAL_API_KEY: smoke_test_internal_key_at_least_32_chars
          CLOUDFLARE_TUNNEL_TOKEN: unused-in-ci
        run: |
          # Tunnel and watchtower are host concerns, not part of the artifact.
          docker compose up -d --build db api game-server

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' puyio-api 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then echo "API healthy after ${i}0s"; exit 0; fi
            if [ "$status" = "unhealthy" ]; then echo "::error::API became unhealthy"; break; fi
            sleep 10
          done
          echo "::error::API did not become healthy in time"
          exit 1

      - name: Check the API answers over HTTP
        run: |
          body=$(curl -fsS --max-time 10 http://localhost:8080/health)
          echo "$body"
          echo "$body" | grep -q '"database":"connected"' \
            || { echo "::error::API is up but not connected to Postgres"; exit 1; }

      - name: Check the game server answers
        run: |
          body=$(curl -fsS --max-time 10 http://localhost:3000/health)
          echo "game server: $body"
          [ "$body" = "OK" ] || { echo "::error::unexpected game server health response"; exit 1; }

      - name: Confirm migrations actually ran
        env:
          DB_PASSWORD: smoke_test_password
        run: |
          # The entrypoint runs `prisma migrate deploy` before starting. If that
          # silently failed the API would still answer /health, so assert the
          # schema exists rather than trusting the exit code.
          docker compose exec -T -e PGPASSWORD="$DB_PASSWORD" db \
            psql -U postgres -d puyio_db -c '\dt' | tee /tmp/tables.txt
          grep -q 'users' /tmp/tables.txt || { echo "::error::users table missing — migrations did not run"; exit 1; }
          grep -q 'matches' /tmp/tables.txt || { echo "::error::matches table missing"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
