name: Release

# Pushing a version tag (v0.3.0) publishes a GitHub release whose notes are
# that version's section of CHANGELOG.md. Release notes are never written
# separately. The tag must match package.json and the changelog must have the
# section, or this fails before anything is published.
#
# See website/src/content/docs/guides/release.md.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  release:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Extract release notes from CHANGELOG.md
        run: npx tsx scripts/release-notes.ts "${GITHUB_REF_NAME}" > release-notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "Puyo Live ${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
