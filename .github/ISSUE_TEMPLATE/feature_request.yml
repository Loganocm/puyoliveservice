name: Idea or request
description: Something you would like the game or the site to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with
      description: The situation or problem, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways it could work
