# DevOps Hardening: Limit container logs to prevent MiniPC Out-of-Disk errors.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:18-alpine
    container_name: puyio-db
    restart: always
    logging: *default-logging
    networks:
      - puyo-net
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-puyolive}
    volumes:
      - puyio-main_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- REST API (accounts, matches, leaderboard) ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ghcr.io/loganocm/puyio-api:latest
    container_name: puyio-api
    restart: always
    logging: *default-logging
    networks:
      - puyo-net
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-puyolive}
      PORT: 8080
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: https://puyo.live
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  # --- Game Server (WebSocket) ---
  game-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ghcr.io/loganocm/puyio-game:latest
    networks:
      - puyo-net
    container_name: puyo-game
    restart: always
    logging: *default-logging
    environment:
      PORT: 3000
      API_URL: http://api:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
  # :3
  # --- Cloudflare Tunnel (puyo_network) ---
  tunnel:
    image: cloudflare/cloudflared:latest
    networks:
      - puyo-net
    container_name: cloudflared-tunnel
    restart: always
    logging: *default-logging
    command: tunnel run --protocol http2 --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - api
      - game-server
 # :3 :3
  # --- Watchtower (auto-pulls new images from GHCR) ---
  watchtower:
    image: containrrr/watchtower:latest
    logging: *default-logging
    networks:
      - puyo-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REPO_USER=${GITHUB_USER}
      - REPO_PASS=${GITHUB_PAT}
      - DOCKER_API_VERSION=1.44
    command: --interval 300 --cleanup

  # --- Automatic Database Backups (every 10 days, keeps last 10) ---
  db-backup:
    image: postgres:18-alpine
    container_name: puyio-db-backup
    restart: always
    logging: *default-logging
    networks:
      - puyo-net
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATABASE: ${DB_NAME:-puyolive}
    volumes:
      - puyio_backups:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "=== Puyo DB Backup Service Started ==="
        echo "Running immediate backup, then every 10 days..."
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="/backups/puyolive_$$TIMESTAMP.sql.gz"
          echo "[$$TIMESTAMP] Starting backup..."
          pg_dump -Fc --no-owner --no-acl | gzip > "$$BACKUP_FILE"
          if [ $$? -eq 0 ]; then
            SIZE=$$(du -h "$$BACKUP_FILE" | cut -f1)
            echo "[$$TIMESTAMP] Backup complete: $$BACKUP_FILE ($$SIZE)"
          else
            echo "[$$TIMESTAMP] ERROR: Backup failed!"
          fi
          # Keep only last 10 backups
          ls -t /backups/puyolive_*.sql.gz 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null
          REMAINING=$$(ls /backups/puyolive_*.sql.gz 2>/dev/null | wc -l)
          echo "[$$TIMESTAMP] $$REMAINING backups stored."
          # Sleep 10 days (864000 seconds)
          sleep 864000
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  puyoliveservice_postgres_data:
    external: true
  puyio_backups:
    driver: local

networks:
  puyo-net:
    driver: bridge
